name: dashboard-updates

on:
  schedule:
    - cron: '0 6 * * *' # 6 AM — Games + GoodReads + Spotify
    - cron: '0 18 * * *' # 6 PM — Spotify only
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'src/assets/data/spotify/**'
      - 'src/assets/data/games/**'
      - 'src/assets/data/goodreads/**'

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0

    - name: Set Up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache Python Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install Spotify Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r src/assets/data/spotify/requirements.txt

    - name: Install Games Python Dependencies
      # Only Install at 6 AM / Manual Trigger
      if: github.event.schedule != '0 18 * * *'
      run: |
        pip install -r src/assets/data/games/requirements.txt

    - name: Install GoodReads Python Dependencies
      # Only Install at 6 AM / Manual Trigger
      if: github.event.schedule != '0 18 * * *'
      run: |
        pip install -r src/assets/data/goodreads/requirements.txt

    - name: Set Up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install Node.js Dependencies
      run: npm ci

    # Games ETL
    - name: Create .env file for Steam API
      # Only Create at 6 AM / Manual Trigger
      if: github.event.schedule != '0 18 * * *'
      run: |
        echo "STEAM_API_KEY=${{ secrets.STEAM_API_KEY }}" > src/assets/data/games/steam/.env

    - name: Create .env file for PSN API
      # Only Create at 6 AM / Manual Trigger
      if: github.event.schedule != '0 18 * * *'
      run: |
        echo "NPSSO_CODE=${{ secrets.NPSSO_CODE }}" > src/assets/data/games/psn/.env

    - name: Run Games Data Update
      # Only Run at 6 AM / Manual Trigger
      if: github.event.schedule != '0 18 * * *'
      run: |
        cd src/assets/data/games
        python games.py

    # GoodReads ETL
    - name: Create .env file for GoodReads RSS
      # Only Create at 6 AM / Manual Trigger
      if: github.event.schedule != '0 18 * * *'
      run: |
        echo "GOODREADS_USER_ID=${{ secrets.GOODREADS_USER_ID }}" > src/assets/data/goodreads/.env

    - name: Run GoodReads Data Update
      # Only Run at 6 AM / Manual Trigger
      if: github.event.schedule != '0 18 * * *'
      run: |
        cd src/assets/data/goodreads
        python goodreads.py

    # Spotify ETL
    - name: Create .env file for Spotify API
      run: |
        cat > src/assets/data/spotify/.env << EOF
        SPOTIFY_CLIENT_ID=${{ secrets.SPOTIFY_CLIENT_ID }}
        SPOTIFY_CLIENT_SECRET=${{ secrets.SPOTIFY_CLIENT_SECRET }}
        SPOTIFY_REDIRECT_URI=${{ secrets.SPOTIFY_REDIRECT_URI }}
        EOF

    - name: Restore Spotify Token Cache
      env:
        SPOTIFY_CACHE: ${{ secrets.SPOTIFY_TOKEN_CACHE }}
      run: |
        python3 << 'PY'
        import base64, json, os, pathlib, sys

        raw = os.environ.get("SPOTIFY_CACHE", "").strip()
        if not raw:
            sys.exit("SPOTIFY_TOKEN_CACHE secret is empty")

        if (raw[0] == raw[-1]) and raw[0] in "\"'":
            raw = raw[1:-1].strip()

        data = None
        try:
            data = json.loads(raw)
        except json.JSONDecodeError:
            try:
                data = json.loads(base64.b64decode(raw).decode("utf-8"))
            except Exception:
                sys.exit("SPOTIFY_TOKEN_CACHE is not valid JSON. Paste the full .cache file (starts with {).")

        if not isinstance(data, dict) or "refresh_token" not in data:
            sys.exit("SPOTIFY_TOKEN_CACHE JSON is missing refresh_token")

        path = pathlib.Path("src/assets/data/spotify/.cache")
        path.write_text(json.dumps(data), encoding="utf-8")
        print("Spotify token cache restored")
        PY

    - name: Run Spotify Data Update
      run: |
        cd src/assets/data/spotify
        python spotify.py

    # Commit + Deploy
    - name: Check for Changes
      id: changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add -A
        if git diff --staged --quiet; then
          echo "no_changes=true" >> $GITHUB_OUTPUT
        else
          echo "no_changes=false" >> $GITHUB_OUTPUT
        fi

    - name: Commit and Push Changes
      if: steps.changes.outputs.no_changes == 'false'
      run: |
        git commit -m "📊 Update Dashboard Data - $(date '+%Y-%m-%d %H:%M:%S')"
        git pull --rebase origin main
        git push

    - name: Build React App
      # Only Build If There Are Changes to Deploy
      if: steps.changes.outputs.no_changes == 'false'
      run: npm run build

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      # Only Deploy If There Are Changes to Deploy
      if: github.ref == 'refs/heads/main' && steps.changes.outputs.no_changes == 'false'
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./build
        user_name: 'github-actions[bot]'
        user_email: 'github-actions[bot]@users.noreply.github.com'
        commit_message: '🚀 Deploy Updated Dashboard(s)'
        cname: muntakim-rahman.xyz